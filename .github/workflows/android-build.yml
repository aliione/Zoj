name: Android Release Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Source
        uses: actions/checkout@v4


      - name: Show Project Structure
        run: |
          echo "Current directory:"
          pwd

          echo "Root files:"
          ls -la

          echo "Searching gradlew:"
          find . -name gradlew -type f


      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'


      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4


      - name: Find Gradle Wrapper
        id: gradle
        shell: bash
        run: |
          GRADLE_PATH=$(find . -name gradlew -type f | head -n 1)

          if [ -z "$GRADLE_PATH" ]; then
            echo "ERROR: gradlew not found"
            exit 1
          fi

          echo "Found: $GRADLE_PATH"

          chmod +x "$GRADLE_PATH"

          DIR=$(dirname "$GRADLE_PATH")

          echo "dir=$DIR" >> $GITHUB_OUTPUT


      - name: Build Debug APK
        run: |
          cd "${{ steps.gradle.outputs.dir }}"
          ./gradlew assembleDebug


      - name: Build Release APK
        run: |
          cd "${{ steps.gradle.outputs.dir }}"
          ./gradlew assembleRelease


      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Debug-APK
          path: |
            **/build/outputs/apk/debug/*.apk


      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Release-APK
          path: |
            **/build/outputs/apk/release/*.apk


      - name: Upload Build Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Reports
          path: |
            **/build/reports/**
